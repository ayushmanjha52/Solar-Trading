# Render Blueprint: the interactive market as one web service.
# Render dashboard -> New -> Blueprint -> this repository.
services:
  - type: web
    name: local-energy-market
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    # Free instance: 512 MB, sleeps after ~15 idle minutes. Waking takes about a minute and
    # restarts the market at its default day (12 Nov 2012, 10:00), since history is in memory.
    plan: free
    healthCheckPath: /api/clock
    envVars:
      # Locks the shared clock to the operator. Render generates the value; read it
      # in the service's Environment tab to unlock the Operator controls.
      - key: LEM_ADMIN_TOKEN
        generateValue: true
      - key: LEM_CHAIN
        value: "0"
