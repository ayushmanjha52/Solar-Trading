name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" # Mondays: regenerate every results table from scratch

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            ml/requirements.txt
            sim/requirements.txt
      - name: Python dependencies
        run: pip install -r sim/requirements.txt

      - name: Data from scratch (Ausgrid archive, ERA5 via Open-Meteo)
        run: python -m ml.data

      - name: Python tests
        run: python -m pytest ml market sim -q

      - uses: foundry-rs/foundry-toolchain@v1
      - name: Contract tests
        working-directory: contracts
        run: forge test

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web typecheck, lint, build
        working-directory: web
        run: |
          npm ci
          npx tsc --noEmit
          npx next lint
          npm run build

  results:
    # The headline numbers, regenerated from nothing on a clean machine.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            ml/requirements.txt
            sim/requirements.txt
      - run: pip install -r sim/requirements.txt
      - name: Data
        run: python -m ml.data
      - name: Forecasting (Milestone 2)
        run: python -m ml.evaluate
      - name: Study (Milestone 6)
        run: python -m sim.study
      - name: Publish the tables
        run: |
          cat reports/forecasting/results.md >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat reports/study/results.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            reports/
            data/processed/quality_report.json
